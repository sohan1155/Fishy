        <!-- Firebase coin sync -->
        <script type="module">
          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
          import { getDatabase, ref, update, get, runTransaction } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

          const firebaseConfig = {
            apiKey: "AIzaSyBFrAnpFptQn4dabu76kSNgtUl-OsXODkQ",
            authDomain: "fishy-e8ba3.firebaseapp.com",
            databaseURL: "https://fishy-e8ba3-default-rtdb.firebaseio.com",
            projectId: "fishy-e8ba3",
            storageBucket: "fishy-e8ba3.firebasestorage.app",
            messagingSenderId: "263182050564",
            appId: "1:263182050564:web:59d70499ccb25c38089c51"
          };

          const app = initializeApp(firebaseConfig);
          const db = getDatabase(app);

          const tg = window.Telegram?.WebApp;
          tg?.ready();
          const userId = tg?.initDataUnsafe?.user?.id || "test_user";

          // ====== REFERRAL / INVITE SYSTEM ======
          // TODO: replace these two with your real bot username and Mini App short name
          // (the same ones used in your t.me link, e.g. https://t.me/YourBot/YourApp)
          const BOT_USERNAME = "Fishymine_bot";
          const APP_SHORT_NAME = "Fishy";

          const REFERRER_BONUS = 50000;   // real game coins the inviter gets per successful invite
          const INVITEE_BONUS  = 50000;   // real game coin welcome bonus for the invited friend

          function buildInviteLink() {
            return `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}?startapp=ref_${userId}`;
          }

          // Credit both sides once, the first time a referred user opens the game.
          // Bonuses are queued as "pendingCoinBonus" and injected straight into the
          // player's live in-game coin balance (see applyPendingCoinBonus below) —
          // this works even for the referrer, who isn't online right now, because
          // their pending amount gets applied the next time THEY open the game.
          async function processReferralIfNeeded() {
            const startParam = tg?.initDataUnsafe?.start_param;
            if (!startParam || !startParam.startsWith('ref_')) return;

            const referrerId = startParam.replace('ref_', '');
            if (!referrerId || referrerId === String(userId)) return; // can't refer yourself

            const myRef = ref(db, 'users/' + userId);
            const mySnap = await get(myRef);
            const alreadyProcessed = mySnap.exists() && mySnap.val().referredBy;
            if (alreadyProcessed) return; // only credit once, ever

            // Mark this user as referred, and queue their welcome bonus
            const myPending = (mySnap.exists() && mySnap.val().pendingCoinBonus) || 0;
            await update(myRef, {
              referredBy: referrerId,
              pendingCoinBonus: myPending + INVITEE_BONUS,
              lastUpdated: Date.now()
            });

            // Credit the inviter: +1 to their referral count and queue their bonus
            const referrerRef = ref(db, 'users/' + referrerId);
            const referrerSnap = await get(referrerRef);
            const referrerPending = (referrerSnap.exists() && referrerSnap.val().pendingCoinBonus) || 0;
            const referrerCount = (referrerSnap.exists() && referrerSnap.val().referralCount) || 0;
            await update(referrerRef, {
              pendingCoinBonus: referrerPending + REFERRER_BONUS,
              referralCount: referrerCount + 1,
              lastUpdated: Date.now()
            });
          }

          // Applies any queued coin bonus (from referrals) to THIS player's live
          // game balance. Retries briefly in case this runs before the game
          // engine has finished creating its coin-holding instance.
          async function applyPendingCoinBonus() {
            const userRef = ref(db, 'users/' + userId);
            const snap = await get(userRef);
            const pending = (snap.exists() && snap.val().pendingCoinBonus) || 0;
            if (pending <= 0) return;

            let attempts = 0;
            const tryApply = setInterval(function() {
              attempts++;
              if (typeof window.__addBonusCoins === 'function' && window.__addBonusCoins(pending)) {
                clearInterval(tryApply);
                update(userRef, { pendingCoinBonus: 0, lastUpdated: Date.now() });
              } else if (attempts > 40) { // give up after ~20 seconds
                clearInterval(tryApply);
              }
            }, 500);
          }

          async function refreshInviteCountLabel() {
            const label = document.getElementById('invite-count-label');
            if (!label) return;
            const snap = await get(ref(db, 'users/' + userId));
            const count = (snap.exists() && snap.val().referralCount) || 0;
            label.textContent = `${count} invited`;
            label.style.display = 'block';
          }

          function showInviteModal() {
            const link = buildInviteLink();
            const input = document.getElementById('invite-link-input');
            const backdrop = document.getElementById('invite-modal-backdrop');
            const feedback = document.getElementById('invite-copy-feedback');
            if (input) input.value = link;
            if (feedback) feedback.textContent = '';
            if (backdrop) backdrop.style.display = 'flex';
          }

          function copyInviteLink() {
            const input = document.getElementById('invite-link-input');
            const feedback = document.getElementById('invite-copy-feedback');
            const link = input ? input.value : '';
            function showCopied() {
              if (feedback) feedback.textContent = '✓ Copied!';
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(link).then(showCopied).catch(function() {
                input?.select();
                document.execCommand('copy');
                showCopied();
              });
            } else if (input) {
              input.select();
              document.execCommand('copy');
              showCopied();
            }
          }

          window.addEventListener('DOMContentLoaded', function() {
            const inviteBtn = document.getElementById('invite-friends-button');
            if (inviteBtn) inviteBtn.addEventListener('click', showInviteModal);

            const copyBtn = document.getElementById('invite-copy-button');
            if (copyBtn) copyBtn.addEventListener('click', copyInviteLink);

            const closeBtn = document.getElementById('invite-close-button');
            const backdrop = document.getElementById('invite-modal-backdrop');
            if (closeBtn && backdrop) {
              closeBtn.addEventListener('click', function() {
                backdrop.style.display = 'none';
              });
            }
            if (backdrop) {
              backdrop.addEventListener('click', function(e) {
                if (e.target === backdrop) backdrop.style.display = 'none';
              });
            }

            processReferralIfNeeded().finally(function() {
              refreshInviteCountLabel();
              applyPendingCoinBonus();
            });
          });
          // ====== END REFERRAL / INVITE SYSTEM ======

          // ====== REAL GAME COIN SYNC (for admin dashboard only) ======
          // TinyFishing.js calls window.onGameCoinsUpdate(amount) every
          // time coins_add() runs in-game (both earning and spending), so
          // this always reflects the player's CURRENT real coin balance.
          let gameCoinsSaveTimer = null;
          let pendingGameCoins = null;

          window.onGameCoinsUpdate = function(amount) {
            const value = Math.floor(Number(amount));
            if (!isFinite(value) || value < 0) return;
            pendingGameCoins = value;
            if (!gameCoinsSaveTimer) {
              gameCoinsSaveTimer = setTimeout(function() {
                gameCoinsSaveTimer = null;
                if (pendingGameCoins === null) return;
                update(ref(db, 'users/' + userId), {
                  gameCoins: pendingGameCoins,
                  lastUpdated: Date.now()
                });
                pendingGameCoins = null;
              }, 2000);
            }
          };
          // ====== END REAL GAME COIN SYNC ======

          // Save the connected wallet address (merges, doesn't wipe points)
          window.saveWallet = function(address) {
            update(ref(db, 'users/' + userId), {
              walletAddress: address,
              walletConnectedAt: Date.now()
            });
          };
        </script>

        <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
        <script>
          window.addEventListener('load', function() {
            // IMPORTANT: replace this URL with your own hosted manifest —
            // see instructions for tonconnect-manifest.json
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
              manifestUrl: 'https://sohan1155.github.io/Fishy/tonconnect-manifest.json',
              buttonRootId: 'ton-connect-button'
            });

            tonConnectUI.onStatusChange(function(wallet) {
              if (wallet && wallet.account && wallet.account.address) {
                window.saveWallet(wallet.account.address);
              }
            });
          });
        </script>

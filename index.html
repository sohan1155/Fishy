          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
          import { getDatabase, ref, update, get, runTransaction } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

          const firebaseConfig = {

          // ====== REFERRAL / INVITE SYSTEM ======
          // TODO: replace these two with your real bot username and Mini App short name
          // (the same ones used in your t.me link, e.g. https://t.me/YourBot/YourApp)
          const BOT_USERNAME = "Fishymine_bot";
          const APP_SHORT_NAME = "Fishy";

          const REFERRER_BONUS = 10000;   // Fishy coins the inviter gets per successful invite
          const INVITEE_BONUS  = 10000;   // Fishy welcome bonus for the invited friend

          function buildInviteLink() {
            return `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}?startapp=ref_${userId}`;
          }

          // Credit both sides once, the first time a referred user opens the game
          async function processReferralIfNeeded() {
            const startParam = tg?.initDataUnsafe?.start_param;
            if (!startParam || !startParam.startsWith('ref_')) return;

            const referrerId = startParam.replace('ref_', '');
            if (!referrerId || referrerId === String(userId)) return; // can't refer yourself

            const myRef = ref(db, 'users/' + userId);
            const mySnap = await get(myRef);
            const alreadyProcessed = mySnap.exists() && mySnap.val().referredBy;
            if (alreadyProcessed) return; // only credit once, ever

            // Mark this user as referred, and give them a Fishy welcome bonus
            const currentFishy = (mySnap.exists() && mySnap.val().fishyCoins) || 0;
            await update(myRef, {
              referredBy: referrerId,
              fishyCoins: currentFishy + INVITEE_BONUS,
              lastUpdated: Date.now()
            });

            // Credit the inviter: +1 to their referral count and + bonus Fishy
            const referrerRef = ref(db, 'users/' + referrerId);
            const referrerSnap = await get(referrerRef);
            const referrerFishy = (referrerSnap.exists() && referrerSnap.val().fishyCoins) || 0;
            const referrerCount = (referrerSnap.exists() && referrerSnap.val().referralCount) || 0;
            await update(referrerRef, {
              fishyCoins: referrerFishy + REFERRER_BONUS,
              referralCount: referrerCount + 1,
              lastUpdated: Date.now()
            });
          }

          async function refreshInviteCountLabel() {
            const label = document.getElementById('invite-count-label');
            if (!label) return;
            const snap = await get(ref(db, 'users/' + userId));
            const count = (snap.exists() && snap.val().referralCount) || 0;
            label.textContent = `${count} invited`;
            label.style.display = 'block';
          }

          function showInviteModal() {
            const link = buildInviteLink();
            const input = document.getElementById('invite-link-input');
            const backdrop = document.getElementById('invite-modal-backdrop');
            const feedback = document.getElementById('invite-copy-feedback');
            if (input) input.value = link;
            if (feedback) feedback.textContent = '';
            if (backdrop) backdrop.style.display = 'flex';
          }

          function copyInviteLink() {
            const input = document.getElementById('invite-link-input');
            const feedback = document.getElementById('invite-copy-feedback');
            const link = input ? input.value : '';
            function showCopied() {
              if (feedback) feedback.textContent = '✓ Copied!';
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(link).then(showCopied).catch(function() {
                input?.select();
                document.execCommand('copy');
                showCopied();
              });
            } else if (input) {
              input.select();
              document.execCommand('copy');
              showCopied();
            }
          }

          window.addEventListener('DOMContentLoaded', function() {
            const inviteBtn = document.getElementById('invite-friends-button');
            if (inviteBtn) inviteBtn.addEventListener('click', showInviteModal);

            const copyBtn = document.getElementById('invite-copy-button');
            if (copyBtn) copyBtn.addEventListener('click', copyInviteLink);

            const closeBtn = document.getElementById('invite-close-button');
            const backdrop = document.getElementById('invite-modal-backdrop');
            if (closeBtn && backdrop) {
              closeBtn.addEventListener('click', function() {
                backdrop.style.display = 'none';
              });
            }
            if (backdrop) {
              backdrop.addEventListener('click', function(e) {
                if (e.target === backdrop) backdrop.style.display = 'none';
              });
            }

            processReferralIfNeeded().finally(function() {
              refreshInviteCountLabel();
              refreshFishyBadge();
            });
          });
          // ====== END REFERRAL / INVITE SYSTEM ======

          const CONVERSION_RATE = 1000; // 1000 points = 1 Fishy

            // has the true up-to-date point count before we convert.
            if (saveTimer) {
              clearTimeout(saveTimer);
              saveTimer = null;
            }
            return update(ref(db, 'users/' + userId), {
              points: tapCount,
              lastUpdated: Date.now()

          }

          async function refreshFishyBadge() {
            const badge = document.getElementById('fishy-balance-value');
            if (!badge) return;
            const snap = await get(ref(db, 'users/' + userId));
            const fishy = (snap.exists() && snap.val().fishyCoins) || 0;
            badge.textContent = fishy.toLocaleString();
          }

          async function refreshConvertBalances() {
            const snap = await get(ref(db, 'users/' + userId));
            const data = snap.exists() ? snap.val() : {};
            const points = data.points || 0;
            const fishy = data.fishyCoins || 0;

            document.getElementById('convert-points-balance').textContent = points.toLocaleString();
            document.getElementById('convert-fishy-balance').textContent = fishy.toLocaleString();
            document.getElementById('fishy-balance-value').textContent = fishy.toLocaleString();
            document.getElementById('convert-amount-input').max = points;
            updateConvertPreview();
          }

          function updateConvertPreview() {
            const input = document.getElementById('convert-amount-input');
            const amount = parseInt(input.value, 10) || 0;
            const fishyPreview = Math.floor(amount / CONVERSION_RATE);
            document.getElementById('convert-preview-amount').textContent = fishyPreview.toLocaleString();
          }

          async function openConvertModal() {
            const backdrop = document.getElementById('convert-modal-backdrop');
            const feedback = document.getElementById('convert-feedback');
            if (feedback) feedback.textContent = '';
            if (backdrop) backdrop.style.display = 'flex';
            await flushPendingPoints();
            await refreshConvertBalances();
          }

          function closeConvertModal() {
            const backdrop = document.getElementById('convert-modal-backdrop');
            if (backdrop) backdrop.style.display = 'none';
          }

          // Uses a Firebase transaction so the deduct (points) and the
          // credit (fishyCoins) happen atomically against whatever value
          // is currently in the database — avoids a race if this ever
          // runs from two tabs/devices at once.
          async function submitConvert() {
            const input = document.getElementById('convert-amount-input');
            const feedback = document.getElementById('convert-feedback');
            const amount = parseInt(input.value, 10);

            if (!amount || amount < CONVERSION_RATE) {
              feedback.style.color = '#ff6b6b';
              feedback.textContent = `কমপক্ষে ${CONVERSION_RATE} Points দরকার`;
              return;
            }

            const fishyToAdd = Math.floor(amount / CONVERSION_RATE);
            const pointsToDeduct = fishyToAdd * CONVERSION_RATE;

            const userRef = ref(db, 'users/' + userId);
            const result = await runTransaction(userRef, function(current) {
              if (!current) return current; // abort, no user record yet
              const currentPoints = current.points || 0;
              if (currentPoints < pointsToDeduct) {
                return; // abort transaction — not enough points
              }
              current.points = currentPoints - pointsToDeduct;
              current.fishyCoins = (current.fishyCoins || 0) + fishyToAdd;
              current.lastUpdated = Date.now();
              return current;
            });

            if (!result.committed) {
              feedback.style.color = '#ff6b6b';
              feedback.textContent = 'যথেষ্ট Points নেই';
              return;
            }

            // Keep the in-memory tap counter in sync with the new balance
            tapCount = result.snapshot.val().points || 0;

            feedback.style.color = '#4caf50';
            feedback.textContent = `✓ ${fishyToAdd} Fishy পেয়েছেন!`;
            input.value = '';
            await refreshConvertBalances();
          }

          window.addEventListener('DOMContentLoaded', function() {
            const openBtn = document.getElementById('convert-open-button');
            const closeBtn = document.getElementById('convert-close-button');
            const submitBtn = document.getElementById('convert-submit-button');
            const input = document.getElementById('convert-amount-input');
            const backdrop = document.getElementById('convert-modal-backdrop');

            if (openBtn) openBtn.addEventListener('click', openConvertModal);
            if (closeBtn) closeBtn.addEventListener('click', closeConvertModal);
            if (submitBtn) submitBtn.addEventListener('click', submitConvert);
            if (input) input.addEventListener('input', updateConvertPreview);
            if (backdrop) {
              backdrop.addEventListener('click', function(e) {
                if (e.target === backdrop) closeConvertModal();
              });
            }
          });
          // ====== END CONVERT SYSTEM ======

          // Save the current point count to Firebase (merges, doesn't wipe walletAddress)
          window.savePoints = function(points) {
            update(ref(db, 'users/' + userId), {
              points: points,
              lastUpdated: Date.now()
            });
          };

          // Save the connected wallet address (merges, doesn't wipe points)
          window.saveWallet = function(address) {
            update(ref(db, 'users/' + userId), {
              walletAddress: address,
              walletConnectedAt: Date.now()
            });
          };

          // Load the saved point count from Firebase
          window.loadPoints = async function() {
            const snapshot = await get(ref(db, 'users/' + userId));
            return snapshot.exists() && snapshot.val().points ? snapshot.val().points : 0;
          };

          // --- Tap/catch counter ---
          // This does NOT read any variable from inside the game.
          // It simply counts how many times the player taps/clicks the
          // canvas (i.e. how many times they try to catch a fish) and
          // treats that as the "points" total for the airdrop.
          let tapCount = 0;
          let saveTimer = null;

          window.loadPoints().then(function(saved) {
            tapCount = saved || 0;
          });

          function registerTap() {
            tapCount += 1;
            // Debounce Firebase writes so we don't spam the database
            // on every single tap — save at most once every 2 seconds.
            if (!saveTimer) {
              saveTimer = setTimeout(function() {
                window.savePoints(tapCount);
                saveTimer = null;
              }, 2000);
            }
          }

          window.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('canvas');
            if (canvas) {
              canvas.addEventListener('pointerdown', registerTap);
            }
          });
          // In case DOMContentLoaded already fired before this script ran
          const existingCanvas = document.getElementById('canvas');
          if (existingCanvas) {
            existingCanvas.addEventListener('pointerdown', registerTap);
          }
        </script>

        <!-- TON Connect SDK -->
        <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
        <script>
          window.addEventListener('load', function() {
            // IMPORTANT: replace this URL with your own hosted manifest —
            // see instructions for tonconnect-manifest.json
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
              manifestUrl: 'https://sohan1155.github.io/Fishy/tonconnect-manifest.json',
              buttonRootId: 'ton-connect-button'
            });

            tonConnectUI.onStatusChange(function(wallet) {
              if (wallet && wallet.account && wallet.account.address) {
                window.saveWallet(wallet.account.address);
              }
            });
          });
        </script>

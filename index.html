    <style>

.pokiSdkPauseButton {

}

		transform: translate(-50%, -50%) scale(0.95);

		transform: translate(-50%, -50%) scale(1.1);

}

.pokiSdkProgressContainer {

        <!-- Invite Friends button (placed below the in-game AQUARIUM button) -->
        <!-- NOTE: the AQUARIUM button is drawn by the game engine inside the canvas,
             not a real DOM element, so this is an overlay positioned by percentage.
             Adjust the "top" value below if it doesn't line up perfectly on your device. -->
        <button id="invite-friends-button" style="
            position: fixed;
            top: 33%;

        "></div>

        <!-- Play-limit lock overlay: approximate region over the in-game PLAY button.
             Coordinates are guessed from a screenshot (percent of viewport) since the
             button itself is drawn inside the canvas, not a real DOM element.
             Adjust PLAY_BTN_* percentages in the script below if it doesn't line up. -->
        <div id="play-lock-overlay" style="
            position: fixed;
            left: 33%;
            top: 57%;
            width: 34%;
            height: 17%;
            z-index: 4000;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 50%;
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            padding: 6px;
            pointer-events: none;
        ">🔒 <span id="play-lock-timer"></span></div>

        <!-- Firebase coin sync -->
        <script type="module">
          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
          import { getDatabase, ref, update, get } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

          const firebaseConfig = {
            apiKey: "AIzaSyBFrAnpFptQn4dabu76kSNgtUl-OsXODkQ",
            authDomain: "fishy-e8ba3.firebaseapp.com",
            databaseURL: "https://fishy-e8ba3-default-rtdb.firebaseio.com",
            projectId: "fishy-e8ba3",
            storageBucket: "fishy-e8ba3.firebasestorage.app",
            messagingSenderId: "263182050564",
            appId: "1:263182050564:web:59d70499ccb25c38089c51"
          };

          const app = initializeApp(firebaseConfig);
          const db = getDatabase(app);

          const tg = window.Telegram?.WebApp;
          tg?.ready();
          const userId = tg?.initDataUnsafe?.user?.id || "test_user";

          // ====== REFERRAL / INVITE SYSTEM ======
          // TODO: replace these two with your real bot username and Mini App short name
          // (the same ones used in your t.me link, e.g. https://t.me/YourBot/YourApp)
          const BOT_USERNAME = "Fishymine_bot";
          const APP_SHORT_NAME = "Fishy";

          const REFERRER_BONUS = 50000;   // points the inviter gets per successful invite
          const INVITEE_BONUS  = 50000;   // welcome bonus for the invited friend

          function buildInviteLink() {
            return `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}?startapp=ref_${userId}`;
          }

          // Credit both sides once, the first time a referred user opens the game
          async function processReferralIfNeeded() {
            const startParam = tg?.initDataUnsafe?.start_param;
            if (!startParam || !startParam.startsWith('ref_')) return;

            const referrerId = startParam.replace('ref_', '');
            if (!referrerId || referrerId === String(userId)) return; // can't refer yourself

            const myRef = ref(db, 'users/' + userId);
            const mySnap = await get(myRef);
            const alreadyProcessed = mySnap.exists() && mySnap.val().referredBy;
            if (alreadyProcessed) return; // only credit once, ever

            // Mark this user as referred, and give them a welcome bonus
            const currentPoints = (mySnap.exists() && mySnap.val().points) || 0;
            await update(myRef, {
              referredBy: referrerId,
              points: currentPoints + INVITEE_BONUS,
              lastUpdated: Date.now()
            });
            tapCount = currentPoints + INVITEE_BONUS;

            // Credit the inviter: +1 to their referral count and + bonus points
            const referrerRef = ref(db, 'users/' + referrerId);
            const referrerSnap = await get(referrerRef);
            const referrerPoints = (referrerSnap.exists() && referrerSnap.val().points) || 0;
            const referrerCount = (referrerSnap.exists() && referrerSnap.val().referralCount) || 0;
            await update(referrerRef, {
              points: referrerPoints + REFERRER_BONUS,
              referralCount: referrerCount + 1,
              lastUpdated: Date.now()
            });
          }

          async function refreshInviteCountLabel() {
            const label = document.getElementById('invite-count-label');
            if (!label) return;
            const snap = await get(ref(db, 'users/' + userId));
            const count = (snap.exists() && snap.val().referralCount) || 0;
            label.textContent = `${count} invited`;
            label.style.display = 'block';
          }

          function shareInvite() {
            const link = buildInviteLink();
            const text = "🎣 Come fish with me on Fishy and earn rewards! Join here:";
            if (tg && tg.openTelegramLink) {
              tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`);
            } else if (navigator.share) {
              navigator.share({ title: 'Fishy', text, url: link }).catch(function(){});
            } else {
              navigator.clipboard?.writeText(link);
              alert('Invite link copied:\n' + link);
            }
          }

          window.addEventListener('DOMContentLoaded', function() {
            const inviteBtn = document.getElementById('invite-friends-button');
            if (inviteBtn) inviteBtn.addEventListener('click', shareInvite);
            processReferralIfNeeded().finally(refreshInviteCountLabel);
          });
          // ====== END REFERRAL / INVITE SYSTEM ======

          // Save the current point count to Firebase (merges, doesn't wipe walletAddress)
          window.savePoints = function(points) {
            update(ref(db, 'users/' + userId), {
              points: points,
              lastUpdated: Date.now()
            });
          };

          // Save the connected wallet address (merges, doesn't wipe points)
          window.saveWallet = function(address) {
            update(ref(db, 'users/' + userId), {
              walletAddress: address,
              walletConnectedAt: Date.now()
            });
          };

          // Load the saved point count from Firebase
          window.loadPoints = async function() {
            const snapshot = await get(ref(db, 'users/' + userId));
            return snapshot.exists() && snapshot.val().points ? snapshot.val().points : 0;
          };

          // --- Tap/catch counter ---
          // This does NOT read any variable from inside the game.
          // It simply counts how many times the player taps/clicks the
          // canvas (i.e. how many times they try to catch a fish) and
          // treats that as the "points" total for the airdrop.
          let tapCount = 0;
          let saveTimer = null;

          window.loadPoints().then(function(saved) {
            tapCount = saved || 0;
          });

          // ====== PLAY-BUTTON CAST LIMIT (30 casts, then 4 hour lock) ======
          // Approximate region of the in-game PLAY button, as a percentage of
          // the viewport. Tune these four numbers if the lock zone is off.
          const PLAY_BTN_X_MIN = 0.33;
          const PLAY_BTN_X_MAX = 0.67;
          const PLAY_BTN_Y_MIN = 0.57;
          const PLAY_BTN_Y_MAX = 0.74;

          const MAX_CASTS = 30;
          const COOLDOWN_MS = 4 * 60 * 60 * 1000; // 4 hours

          let castCount = 0;
          let castCycleStart = 0;
          let castLocked = false;
          let castCountdownInterval = null;

          function isTapOnPlayButton(clientX, clientY) {
            const px = clientX / window.innerWidth;
            const py = clientY / window.innerHeight;
            return px >= PLAY_BTN_X_MIN && px <= PLAY_BTN_X_MAX &&
                   py >= PLAY_BTN_Y_MIN && py <= PLAY_BTN_Y_MAX;
          }

          function formatRemaining(ms) {
            const totalMin = Math.max(0, Math.ceil(ms / 60000));
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return h + 'h ' + m + 'm';
          }

          function showCastLock() {
            castLocked = true;
            const overlay = document.getElementById('play-lock-overlay');
            const timerLabel = document.getElementById('play-lock-timer');
            if (!overlay) return;
            overlay.style.display = 'flex';
            overlay.style.pointerEvents = 'auto';

            if (castCountdownInterval) clearInterval(castCountdownInterval);
            function tick() {
              const remaining = (castCycleStart + COOLDOWN_MS) - Date.now();
              if (remaining <= 0) {
                hideCastLock();
                return;
              }
              if (timerLabel) timerLabel.textContent = formatRemaining(remaining);
            }
            tick();
            castCountdownInterval = setInterval(tick, 30000); // update every 30s
          }

          function hideCastLock() {
            castLocked = false;
            castCount = 0;
            castCycleStart = 0;
            if (castCountdownInterval) clearInterval(castCountdownInterval);
            const overlay = document.getElementById('play-lock-overlay');
            if (overlay) {
              overlay.style.display = 'none';
              overlay.style.pointerEvents = 'none';
            }
            saveCastState();
          }

          function saveCastState() {
            update(ref(db, 'users/' + userId), {
              castCount: castCount,
              castCycleStart: castCycleStart
            });
          }

          async function loadCastState() {
            const snap = await get(ref(db, 'users/' + userId));
            const data = snap.exists() ? snap.val() : {};
            castCount = data.castCount || 0;
            castCycleStart = data.castCycleStart || 0;

            if (castCycleStart && (Date.now() - castCycleStart) >= COOLDOWN_MS) {
              // cooldown already finished since last visit
              castCount = 0;
              castCycleStart = 0;
              saveCastState();
            } else if (castCount >= MAX_CASTS && castCycleStart) {
              showCastLock();
            }
          }
          loadCastState();
          // ====== END PLAY-BUTTON CAST LIMIT ======

          function registerTap(event) {
            tapCount += 1;
            // Debounce Firebase writes so we don't spam the database
            // on every single tap — save at most once every 2 seconds.
            if (!saveTimer) {
              saveTimer = setTimeout(function() {
                window.savePoints(tapCount);
                saveTimer = null;
              }, 2000);
            }

            // Cast-limit counting: only taps landing in the approximate
            // PLAY button zone count toward the 30-cast limit.
            if (!castLocked && event && isTapOnPlayButton(event.clientX, event.clientY)) {
              castCount += 1;
              if (castCount >= MAX_CASTS) {
                castCycleStart = Date.now();
                saveCastState();
                showCastLock();
              } else {
                saveCastState();
              }
            }
          }

          window.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('canvas');
            if (canvas) {
              canvas.addEventListener('pointerdown', registerTap);
            }
          });
          // In case DOMContentLoaded already fired before this script ran
          const existingCanvas = document.getElementById('canvas');
          if (existingCanvas) {
            existingCanvas.addEventListener('pointerdown', registerTap);
          }
        </script>

        <!-- TON Connect SDK -->
        <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
        <script>
          window.addEventListener('load', function() {
            // IMPORTANT: replace this URL with your own hosted manifest —
            // see instructions for tonconnect-manifest.json
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
              manifestUrl: 'https://sohan1155.github.io/Fishy/tonconnect-manifest.json',
              buttonRootId: 'ton-connect-button'
            });

            tonConnectUI.onStatusChange(function(wallet) {
              if (wallet && wallet.account && wallet.account.address) {
                window.saveWallet(wallet.account.address);
              }
            });
          });
        </script>
